<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>LexControl OJV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 16px;
      border-bottom: 1px solid #334155;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .status-bar {
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.active { background: #22c55e; animation: pulse 2s infinite; }
    .status-dot.working { background: #f59e0b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text { font-size: 12px; color: #94a3b8; }

    .content { padding: 12px 16px; }

    .section {
      margin-bottom: 12px;
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #334155;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .btn:last-child { margin-bottom: 0; }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #60a5fa, #3b82f6); }

    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }
    .btn-success:hover { background: linear-gradient(135deg, #4ade80, #22c55e); }

    .btn-warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }
    .btn-warning:hover { background: linear-gradient(135deg, #fbbf24, #f59e0b); }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .btn-danger:hover { background: linear-gradient(135deg, #f87171, #ef4444); }

    .btn-outline {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
    }
    .btn-outline:hover { background: #334155; color: #e2e8f0; }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .log-area {
      max-height: 200px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #94a3b8;
      background: #0f172a;
      border-radius: 4px;
      padding: 8px;
      border: 1px solid #1e293b;
    }

    .log-area .log-entry { margin-bottom: 2px; }
    .log-area .log-ok { color: #4ade80; }
    .log-area .log-warn { color: #fbbf24; }
    .log-area .log-err { color: #f87171; }
    .log-area .log-info { color: #60a5fa; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      text-align: center;
      padding: 8px;
      background: #0f172a;
      border-radius: 6px;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
    }

    .stat-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
    }

    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .config-row label {
      font-size: 12px;
      color: #cbd5e1;
    }

    .config-row input[type="number"] {
      width: 60px;
      padding: 4px 8px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 12px;
      text-align: center;
    }

    .config-row select {
      padding: 4px 8px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 12px;
    }

    .footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 10px;
      color: #475569;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚖️ LexControl OJV</h1>
    <div class="subtitle">Revisor automático de Estado Diario — Poder Judicial</div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Esperando conexión con OJV...</span>
  </div>

  <div class="content">

    <!-- Stats -->
    <div class="section">
      <div class="section-title">Progreso</div>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-number" id="causasEncontradas">0</div>
          <div class="stat-label">Causas encontradas</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="pdfsDescargados">0</div>
          <div class="stat-label">PDFs descargados</div>
        </div>
      </div>
    </div>

    <!-- Config -->
    <div class="section">
      <div class="section-title">Configuración</div>
      <div class="config-row">
        <label>Pausa entre causas (seg)</label>
        <input type="number" id="pausaSegs" value="3" min="1" max="30">
      </div>
      <div class="config-row">
        <label>Carpeta descarga</label>
        <select id="carpetaDestino">
          <option value="LexControl_OJV">LexControl_OJV</option>
          <option value="EstadoDiario">EstadoDiario</option>
        </select>
      </div>
    </div>

    <!-- Actions -->
    <div class="section">
      <div class="section-title">Acciones</div>
      <button class="btn btn-primary" id="btnExplorar">
        🔍 Explorar página actual
      </button>
      <button class="btn btn-success" id="btnIniciar" disabled>
        🚀 Iniciar revisión automática
      </button>
      <button class="btn btn-danger" id="btnDetener" disabled>
        ⏹ Detener
      </button>
      <button class="btn btn-outline" id="btnExportar" disabled>
        📋 Exportar resultados
      </button>
    </div>

    <!-- Log -->
    <div class="section">
      <div class="section-title">Bitácora</div>
      <div class="log-area" id="logArea">
        <div class="log-entry log-info">Extensión cargada. Navega a Estado Diario para comenzar.</div>
      </div>
    </div>

  </div>

  <div class="footer">
    LexControl v1.0 — Estudio Jaime Moraga
  </div>

  <script src="popup.js"></script>
</body>
</html>
